; Firmware for the ESP32 sensor (the device the astronaut wears).
; Build and upload with PlatformIO from VS Code (open this folder as its own project).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Serial monitor speed (must match Serial.begin in main.cpp)
monitor_speed = 115200
; File system on the internal flash, where /log.csv is stored
board_build.filesystem = littlefs
lib_deps =
    knolleary/PubSubClient
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
