; Firmware del ESP32 sensor (el dispositivo que lleva el astronauta).
; Compilar y subir con PlatformIO desde VS Code.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Velocidad del monitor serial (debe coincidir con Serial.begin en main.cpp)
monitor_speed = 115200
; Sistema de archivos de la flash interna, donde se guarda /registro.csv
board_build.filesystem = littlefs
lib_deps =
    knolleary/PubSubClient
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
